name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Force the runner to execute JavaScript actions under Node 24.
# GitHub starts forcing this on 2026-06-02 and removes Node 20 on 2026-09-16;
# opting in early surfaces compatibility issues before the deadline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run lint

  build-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: cd frontend && npm run build

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: cd backend && ruff check .
      - run: cd backend && ruff format --check .

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (editable) with dev extras
        run: |
          python -m pip install --upgrade pip setuptools wheel
          cd backend && pip install -e ".[dev]"
      - name: Run pytest
        run: cd backend && pytest -q --cov=app --cov-report=term-missing
